<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#080816">
<title>NEON SNAKE · 霓虹贪吃蛇</title>
<style>
:root{color-scheme:dark;--cyan:#45f7ff;--pink:#ff3da8;--lime:#b8ff4d;--ink:#080816}*{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(ellipse at 50% 38%,#151936 0%,#0b0b19 48%,#05050b 100%);color:#effcff;font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif;display:grid;place-items:center;padding:22px;overflow:auto}.shell{width:min(94vw,680px);text-align:center}.eyebrow{font-size:.72rem;letter-spacing:.34em;color:var(--pink);text-transform:uppercase;margin-bottom:7px;text-shadow:0 0 14px #ff3da8}h1{font-size:clamp(2rem,7vw,3.5rem);line-height:1;margin:0;letter-spacing:.15em;color:white;text-shadow:0 0 8px var(--cyan),0 0 28px #00d9ff99}.sub{margin:11px 0 21px;color:#9bb1c7;font-size:.9rem;letter-spacing:.06em}.hud{display:flex;justify-content:space-between;align-items:center;max-width:520px;margin:0 auto 12px;padding:0 3px}.label{display:block;font-size:.67rem;letter-spacing:.2em;color:#8ca5bd}.value{font-size:1.3rem;color:var(--cyan);font-weight:800;text-shadow:0 0 12px #00eaff88}.best .value{color:var(--lime);text-shadow:0 0 12px #b8ff4d66}.frame{position:relative;margin:auto;padding:9px;border:1px solid #44f6ff99;border-radius:18px;background:#0c1021;box-shadow:0 0 18px #00eaff28,0 0 55px #00eaff12,inset 0 0 24px #00eaff0c}.frame:before{content:"";position:absolute;inset:-4px;border:1px solid #ff3da833;border-radius:21px;filter:blur(5px);pointer-events:none}canvas{display:block;width:min(80vw,500px);height:min(80vw,500px);max-width:100%;aspect-ratio:1;border-radius:10px;background:#080b16;touch-action:none}.overlay{position:absolute;inset:9px;border-radius:11px;display:grid;place-content:center;gap:10px;background:#050711d9;backdrop-filter:blur(5px);z-index:2;padding:20px}.overlay.hidden{display:none}.overlay h2{margin:0;color:var(--pink);font-size:clamp(1.5rem,5vw,2.2rem);letter-spacing:.12em;text-shadow:0 0 18px #ff3da8}.overlay p{margin:0 0 8px;color:#bfd3df}.btn{border:1px solid var(--cyan);border-radius:999px;background:#07151d;color:var(--cyan);font:700 1rem inherit;letter-spacing:.12em;padding:12px 28px;cursor:pointer;box-shadow:0 0 16px #00eaff38;transition:.18s}.btn:hover,.btn:focus-visible{background:var(--cyan);color:#031014;box-shadow:0 0 27px #00eaff99;outline:none}.controls{display:flex;justify-content:center;gap:10px;margin:15px 0 8px}.controls .btn{font-size:.82rem;padding:9px 18px}.help{font-size:.78rem;color:#7890a8;line-height:1.7}.help b{color:#b8d9e8;font-weight:600}.pad{display:grid;grid-template:repeat(2,58px)/repeat(3,68px);gap:8px;justify-content:center;margin:14px auto}.pad button{border:1px solid #4cf5ff80;color:#b9fbff;background:linear-gradient(145deg,#111d32,#0a1220);border-radius:14px;font-size:1.35rem;box-shadow:0 0 14px #00eaff1c;touch-action:manipulation;cursor:pointer}.pad button:active{background:#17414a;box-shadow:0 0 18px #00eaff80;transform:scale(.96)}.pad button:nth-child(1){grid-column:2}.pad button:nth-child(2){grid-row:2;grid-column:1}.pad button:nth-child(3){grid-row:2;grid-column:2}.pad button:nth-child(4){grid-row:2;grid-column:3}@media(max-width:560px){body{padding:12px}.shell{width:100%}.frame{padding:6px;border-radius:14px}.overlay{inset:6px}.hud{max-width:min(80vw,500px)}.help{max-width:340px;margin:auto}.controls{margin-top:9px}.pad{grid-template:repeat(2,62px)/repeat(3,72px);gap:7px;margin:12px auto}.pad button{font-size:1.4rem}}
</style>
</head>
<body>
<main class="shell">
  <div class="eyebrow">Cyber arcade · 01</div>
  <h1>NEON SNAKE</h1>
  <p class="sub">吞下光点，穿梭霓虹矩阵</p>
  <section class="hud" aria-label="游戏分数">
    <div><span class="label">SCORE</span><span class="value" id="score">000</span></div>
    <div class="best"><span class="label">BEST</span><span class="value" id="best">000</span></div>
  </section>
  <div class="frame">
    <canvas id="game" width="500" height="500" aria-label="贪吃蛇游戏画布"></canvas>
    <div class="overlay" id="overlay"><h2 id="message">READY?</h2><p id="detail">准备好进入霓虹矩阵了吗？</p><button class="btn" id="start">开始游戏</button></div>
  </div>
  <div class="pad" aria-label="触屏方向键"><button data-dir="up" aria-label="向上">上</button><button data-dir="left" aria-label="向左">左</button><button data-dir="down" aria-label="向下">下</button><button data-dir="right" aria-label="向右">右</button></div>
  <div class="controls"><button class="btn" id="pause">暂停</button><button class="btn" id="restart">重新开始</button></div>
  <p class="help"><b>方向键 / WASD</b> 控制移动　·　<b>空格</b> 暂停　·　吃到光点得分并加速</p>
</main>
<script>
(()=>{
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),N=25,S=20;
const scoreEl=document.querySelector('#score'),bestEl=document.querySelector('#best'),overlay=document.querySelector('#overlay'),message=document.querySelector('#message'),detail=document.querySelector('#detail'),startBtn=document.querySelector('#start');
const colors=['#45f7ff','#a8ff4d','#d755ff','#ff3da8','#ffd84d'];
let snake,food,dir,nextDir,score,best=Number(localStorage.getItem('neonSnakeBest')||0),timer=null,particles=[],state='ready',last=0;
bestEl.textContent=String(best).padStart(3,'0');
function reset(){snake=[{x:8,y:12},{x:7,y:12},{x:6,y:12}];dir={x:1,y:0};nextDir={...dir};score=0;particles=[];scoreEl.textContent='000';foodColor();placeFood();draw()}
let fcolor=colors[0];function foodColor(){fcolor=colors[Math.floor(Math.random()*colors.length)]}
function placeFood(){const free=[];for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(!snake.some(p=>p.x===x&&p.y===y))free.push({x,y});food=free.length?free[Math.floor(Math.random()*free.length)]:null}
function begin(){clearInterval(timer);reset();state='playing';overlay.classList.add('hidden');startBtn.textContent='再来一局';last=0;timer=setInterval(tick,112)}
function finish(){clearInterval(timer);timer=null;state='over';message.textContent='GAME OVER';detail.textContent=`本局得分 ${score} · 再挑战一次？`;startBtn.textContent='重新开始';overlay.classList.remove('hidden')}
function tick(){if(state!=='playing')return;dir=nextDir;const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y},eats=food&&head.x===food.x&&head.y===food.y;const body=eats?snake:snake.slice(0,-1);if(head.x<0||head.y<0||head.x>=N||head.y>=N||body.some(p=>p.x===head.x&&p.y===head.y)){finish();draw();return}snake.unshift(head);if(eats){score+=10;scoreEl.textContent=String(score).padStart(3,'0');if(score>best){best=score;localStorage.setItem('neonSnakeBest',best);bestEl.textContent=String(best).padStart(3,'0')}burst(food.x*S+S/2,food.y*S+S/2,fcolor);placeFood();foodColor();clearInterval(timer);timer=setInterval(tick,Math.max(55,112-score/10))}else snake.pop();draw()}
function setDirection(name){const d={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}}[name];if(!d||d.x===-dir.x&&d.y===-dir.y)return;nextDir=d;if(state==='ready')begin()}
function pause(){if(state==='playing'){clearInterval(timer);timer=null;state='paused';message.textContent='PAUSED';detail.textContent='稍作休息，矩阵等你回来。';startBtn.textContent='继续游戏';overlay.classList.remove('hidden')}else if(state==='paused'){state='playing';overlay.classList.add('hidden');timer=setInterval(tick,Math.max(55,112-score/10))}}
function burst(x,y,color){for(let i=0;i<18;i++){const a=Math.random()*Math.PI*2,v=1+Math.random()*3;particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1,color,r:1+Math.random()*2})}}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function draw(){ctx.clearRect(0,0,500,500);ctx.fillStyle='#080b16';ctx.fillRect(0,0,500,500);ctx.strokeStyle='rgba(107,184,211,.055)';ctx.lineWidth=1;for(let i=0;i<=500;i+=S){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,500);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i);ctx.lineTo(500,i);ctx.stroke()}
if(food){ctx.save();ctx.shadowBlur=22;ctx.shadowColor=fcolor;ctx.fillStyle=fcolor;ctx.beginPath();ctx.arc(food.x*S+10,food.y*S+10,6.5,0,Math.PI*2);ctx.fill();ctx.restore();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(food.x*S+8,food.y*S+8,1.5,0,Math.PI*2);ctx.fill()}
snake?.forEach((p,i)=>{const c=i===0?'#eaffff':colors[(i+Math.floor(score/10))%colors.length];ctx.save();ctx.shadowBlur=i===0?20:11;ctx.shadowColor=c;ctx.fillStyle=c;roundRect(p.x*S+2,p.y*S+2,S-4,S-4,i===0?7:5);ctx.restore();if(i===0){ctx.fillStyle='#07111a';const ex=p.x*S+10+(dir.x===1?3:dir.x===-1?-3:0),ey=p.y*S+10+(dir.y===1?3:dir.y===-1?-3:0);for(const off of [-3,3]){ctx.beginPath();ctx.arc(ex+(dir.y?off:0),ey+(dir.x?off:0),1.5,0,Math.PI*2);ctx.fill()}}});
ctx.save();particles=particles.filter(p=>p.life>0);for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.life-=.045;ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.color;ctx.shadowBlur=12;ctx.shadowColor=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill()}ctx.restore();if(state==='playing'&&particles.length)requestAnimationFrame(draw)}
window.addEventListener('keydown',e=>{const map={ArrowUp:'up',w:'up',W:'up',ArrowDown:'down',s:'down',S:'down',ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right'};if(map[e.key]){e.preventDefault();setDirection(map[e.key])}else if(e.code==='Space'){e.preventDefault();pause()}else if(e.key==='Enter'&&(state==='ready'||state==='over'))begin()});
document.querySelectorAll('[data-dir]').forEach(b=>{b.addEventListener('pointerdown',e=>{e.preventDefault();setDirection(b.dataset.dir)})});startBtn.addEventListener('click',()=>state==='paused'?pause():begin());document.querySelector('#pause').addEventListener('click',pause);document.querySelector('#restart').addEventListener('click',begin);
let touchX=0,touchY=0;canvas.addEventListener('touchstart',e=>{touchX=e.changedTouches[0].clientX;touchY=e.changedTouches[0].clientY},{passive:true});canvas.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-touchX,dy=e.changedTouches[0].clientY-touchY;if(Math.max(Math.abs(dx),Math.abs(dy))>18)setDirection(Math.abs(dx)>Math.abs(dy)?dx>0?'right':'left':dy>0?'down':'up')},{passive:true});
reset();
})();
</script>
</body>
</html>
